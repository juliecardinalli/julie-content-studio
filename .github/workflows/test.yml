name: Test editing tools

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install media tools
        run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu-core
      - name: Check environment
        run: python3 tools/doctor.py
      - name: Unit tests
        run: python3 -m unittest discover -s tests -v
      - name: Synthetic media integration test
        run: python3 -B tools/smoke_test.py --workdir "$RUNNER_TEMP"
